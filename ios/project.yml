name: TripNote
options:
  bundleIdPrefix: com.akiraak
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # 実機ビルドは `DEVELOPMENT_TEAM=XXXXXXXXXX xcodegen generate` でチームを差し込む
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
targets:
  TripNote:
    type: application
    platform: iOS
    sources:
      - TripNote
    info:
      path: TripNote/Info.plist
      properties:
        CFBundleDisplayName: TripNote
        UILaunchScreen: {}
        UIBackgroundModes: [location]
        # ローカル開発で Mac 上の dev サーバ(http)へ同期するための例外。本番は https
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocationWhenInUseUsageDescription: 旅行中の移動経路を記録するために位置情報を使用します。
        NSLocationAlwaysAndWhenInUseUsageDescription: 画面を閉じている間も旅行中の移動経路を記録し続けるために、位置情報への常時アクセスを許可してください。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akiraak.TripNote
        TARGETED_DEVICE_FAMILY: "1"
  TripNoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TripNoteTests
    dependencies:
      - target: TripNote
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  TripNoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - TripNoteUITests
    dependencies:
      - target: TripNote
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TripNote:
    build:
      targets:
        TripNote: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TripNoteTests
  # UI テストは位置シミュレーション(simctl location)前提のため別スキームで明示実行する
  TripNoteUITests:
    build:
      targets:
        TripNoteUITests: all
    test:
      config: Debug
      targets:
        - TripNoteUITests
