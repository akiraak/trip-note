name: TripNote
options:
  bundleIdPrefix: com.akiraak
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # 実機ビルドは `DEVELOPMENT_TEAM=XXXXXXXXXX xcodegen generate` でチームを差し込む
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
targets:
  TripNote:
    type: application
    platform: iOS
    sources:
      - TripNote
    dependencies:
      # 共有シートの「旅ログ」(Google Maps の共有を受け取る)。App Group 経由で本体に渡す
      - target: TripNoteShare
    entitlements:
      path: TripNote/TripNote.entitlements
      properties:
        com.apple.security.application-groups: [group.com.akiraak.TripNote]
    info:
      path: TripNote/Info.plist
      properties:
        CFBundleDisplayName: 旅ログ
        UILaunchScreen: {}
        UIBackgroundModes: [location]
        # Share Extension の「旅ログを開く」(tripnote://share)
        CFBundleURLTypes:
          - CFBundleURLName: com.akiraak.TripNote
            CFBundleURLSchemes: [tripnote]
        # ローカル開発で Mac 上の dev サーバ(http)へ同期するための例外。本番は https
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocationWhenInUseUsageDescription: 旅行中の移動経路を記録するために位置情報を使用します。
        NSLocationAlwaysAndWhenInUseUsageDescription: 画面を閉じている間も旅行中の移動経路を記録し続けるために、位置情報への常時アクセスを許可してください。
        NSCameraUsageDescription: 旅行の写真・動画を撮影するためにカメラを使用します。
        NSMicrophoneUsageDescription: 動画撮影時に音声を録音するためにマイクを使用します。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akiraak.TripNote
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  # 共有シートに出る Share Extension。受け取った共有を App Group の受信箱に入れて
  # 本体を開くだけ(SwiftData・サーバ設定には触らない)
  TripNoteShare:
    type: app-extension
    platform: iOS
    sources:
      - TripNoteShare
      # 本体と共用する純粋なロジック(URL の抜き出し・受信箱)
      - path: TripNote/Domain/GoogleMapsShare.swift
      - path: TripNote/Services/ShareInbox.swift
    entitlements:
      path: TripNoteShare/TripNoteShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.akiraak.TripNote]
    info:
      path: TripNoteShare/Info.plist
      properties:
        CFBundleDisplayName: 旅ログ
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # URL 1 件 or テキストの共有に出る(Google Maps 以外のテキストにも出るが、
            # リンクが無ければ Extension 側でその旨を表示する)
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akiraak.TripNote.Share
        TARGETED_DEVICE_FAMILY: "1"
  TripNoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TripNoteTests
    dependencies:
      - target: TripNote
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  TripNoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - TripNoteUITests
    dependencies:
      - target: TripNote
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TripNote:
    build:
      targets:
        TripNote: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TripNoteTests
  # UI テストは位置シミュレーション(simctl location)前提のため別スキームで明示実行する
  TripNoteUITests:
    build:
      targets:
        TripNoteUITests: all
    test:
      config: Debug
      targets:
        - TripNoteUITests
